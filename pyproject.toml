[project]
name = "ai-tutorial-hunter"
version = "0.1.0"
description = "Agentic AI that discovers, ranks, and curates trending AI tutorials across the internet"
readme = "AI-TUTORIAL-HUNTER.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nanoSYNAPSYS" }]

dependencies = [
    "anthropic>=0.42.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.49.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "chromadb>=0.5.0",
    "celery>=5.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "jinja2>=3.1.0",
    "feedparser>=6.0.0",
    "aiohttp>=3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
tutorial-hunter = "ai_tutorial_hunter.cli:app"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
